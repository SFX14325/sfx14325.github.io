<!doctype html><html><meta charset=utf-8><title>Knowledge Garden Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#11151b;color:#dce3ed;font:14px system-ui}header,nav{padding:12px;background:#1c222c;border-bottom:1px solid #343d49;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select,textarea{background:#252e3b;color:#e4e9ef;border:1px solid #414c5d;border-radius:5px;padding:8px;font:inherit}button{cursor:pointer}button:hover{background:#394962}main{display:grid;grid-template-columns:260px 1fr 240px;height:calc(100vh - 110px)}aside,article{overflow:auto;padding:14px;border-right:1px solid #343d49}#tree button{display:block;width:100%;text-align:left;margin:3px 0}textarea{width:100%;height:65vh;resize:vertical;font:14px monospace}#page{min-height:65vh;padding:22px;background:#181e27;line-height:1.7;overflow-wrap:anywhere}#page img,#page video{max-width:100%}#page a{color:#9bbaff}#page table{border-collapse:collapse}td,th{border:1px solid #536071;padding:6px}small{color:#9aa8ba}#status{margin-left:auto}#editor{display:flex;gap:10px}#editor>*{flex:1;min-width:0}pre{white-space:pre-wrap}h2{font-size:17px}#search{width:100%}dialog,.studio_dialog{background:#1c222c;color:#dce3ed;border:1px solid #536071;border-radius:8px;padding:12px;max-height:85vh;overflow:auto}dialog::backdrop{background:#0008}dialog select,dialog input:not([type=checkbox]):not([type=color]){width:100%}dialog button{margin-right:5px}</style><header><b>Knowledge Garden Studio</b><input id="root" placeholder="Repository or content path" size="45"><button onclick="openRoot()">Open workspace</button><span id="status">Local workspace</span></header><nav><button onclick="createNote()">New note</button><button onclick="folder()">New folder</button><button onclick="rename_folder()">Rename folder</button><button onclick="tags()">Tags</button><button onclick="dashboard()">Dashboard</button><button onclick="template()">Template</button><button onclick="save()">Save</button><button onclick="delete_note()">Delete note</button><button onclick="archive()">Archive note</button><button onclick="history()">Revisions</button><button onclick="recover()">Recover draft</button></nav><main><aside><input id="search" placeholder="Search notes, tags, dates" oninput="tree()"><h2>Content</h2><div id="tree"></div></aside><article><h2 id="title">Open a workspace</h2><nav><button onclick="mode('page')">Page</button><button onclick="mode('raw')">Markdown</button><button onclick="mode('split')">Split</button><button onclick="insert('**bold**')">Bold</button><button onclick="insert('*italic*')">Italic</button><button onclick="insert('\n## Heading\n')">Heading</button><button onmousedown="event.preventDefault()" onclick="text_color()">Text color</button><button onclick="internal()">Internal link</button><button onclick="external()">External link</button><button onclick="document.querySelector('#file').click()">Import media</button><button onclick="existing_media()">Reference media</button><button onclick="embed()">Video embed</button><button onclick="insert('\n| A | B |\n|---|---|\n| | |\n')">Table</button><input type=file id=file hidden onchange="media(this)"></nav><div id="editor"><textarea id="raw" oninput="changed()"></textarea><div id="page" hidden></div></div></article><aside><h2>Inspector</h2><div id="info"></div><h2>Tools</h2><button onclick="validate()">Validate links</button><button onclick="editTags()">Assign tags</button><button onclick="visualEdit()">Edit rendered page</button><small><p>Visual editing is opt-in and may normalize Markdown. Source editing preserves original syntax.</p></small></aside></main><script>
const token='__TOKEN__', $=id=>document.getElementById(id);let selected_folder="", collapsed=new Set();let data={notes:[],folders:[],tags:{}},path='',original='',view='raw',dirty=false,visual=false;
async function api(action,args={}){let r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Token':token},body:JSON.stringify({action,...args})});let j=await r.json();if(j.error)throw Error(j.error);return j.result}function status(s){$('status').textContent=s}window.addEventListener('unhandledrejection',e=>{status(e.reason.message);notice(e.reason.message)});function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function openRoot(){if(!await leave_note())return;await api('open',{root:$('root').value});path='';dirty=false;$('raw').value='';$('page').innerHTML='';await refresh();status('Workspace open')}async function refresh(){data=await api('list');tree();inspect()}function tree(){let q=$('search').value.toLowerCase(),root=$('tree');root.replaceChildren();let matches=data.notes.filter(n=>JSON.stringify(n).toLowerCase().includes(q));function branch(f,host){if(q&&!matches.some(n=>!f||n.path.startsWith(f+'/'))&&!(data.attachments||[]).some(n=>n.toLowerCase().includes(q)&&(!f||n.startsWith(f+'/'))))return;let row=document.createElement('div');row.style.display='flex';let toggle=document.createElement('button');toggle.style.width='30px';toggle.textContent=collapsed.has(f)&&!q?'▸':'▾';toggle.onclick=()=>{collapsed.has(f)?collapsed.delete(f):collapsed.add(f);tree()};let label=document.createElement('button');label.textContent=f.split('/').pop()||'Content root';label.style.flex='1';label.style.fontWeight='bold';if(f===selected_folder)label.style.background='#435675';label.onclick=()=>{selected_folder=f;tree();status('Selected folder: '+(f||'Content root'))};row.append(toggle,label);host.append(row);if(collapsed.has(f)&&!q)return;let children=document.createElement('div');children.style.paddingLeft='12px';host.append(children);for(let child of data.folders.filter(x=>x&&x.split('/').slice(0,-1).join('/')===f))branch(child,children);for(let n of matches.filter(n=>n.path.split('/').slice(0,-1).join('/')===f)){let b=document.createElement('button');b.textContent=n.title;if(n.path===path)b.style.background='#435675';b.onclick=()=>openNote(n.path);children.append(b)}for(let a of (data.attachments||[]).filter(a=>a.split('/').slice(0,-1).join('/')===f&&a.toLowerCase().includes(q))){let b=document.createElement('button');b.textContent='File: '+a.split('/').pop();b.onclick=()=>attachment(a);children.append(b)}}branch('',root)}async function openNote(p){if(p===path&&dirty)return;if(!await leave_note())return;path=p;selected_folder=p.split("/").slice(0,-1).join("/");tree();original=await api('read',{path});$('raw').value=original;$('title').textContent=p;dirty=false;visual=false;$('page').contentEditable=false;await mode(view);inspect();status('Saved')}function inspect(){let n=data.notes.find(n=>n.path===path);if(!n)return;$('info').innerHTML=Object.entries({Title:n.title,Created:n.created,Updated:n.updated,Version:n.version,Words:n.words,Tags:n.tags,Outgoing:n.links,Backlinks:data.notes.filter(x=>x.links.some(l=>l===path.replace(/\.md$/,''))).map(x=>x.title)}).map(([k,v])=>`<p><small>${k}</small><br>${esc(v??'')}</p>`).join('')}async function preview(){if(!path)return;let h=await api('render',{path,raw:$('raw').value});$('page').innerHTML=h;for(let el of $('page').querySelectorAll('[src]')){let s=el.getAttribute('src');if(!/^[a-z]+:|^\/\//i.test(s)){let u=new URL(s,'http://local/'+path);el.src='/media/'+token+u.pathname}}}async function mode(v){if(visual){if(!await confirm_box('Convert visual changes to Markdown?'))return;let raw=$('raw').value,m=raw.match(/^---\s*\n[\s\S]*?\n---\s*\n?/);let clone=$('page').cloneNode(true);for(let a of clone.querySelectorAll('[data-wiki]'))a.replaceWith(document.createTextNode('[['+a.dataset.wiki+'|'+a.textContent+']]'));for(let el of clone.querySelectorAll('[src]')){let s=el.getAttribute('src');if(s.includes('/media/'+token+'/'))el.setAttribute('src',s.split('/media/'+token+'/')[1].split('/').pop())}$('raw').value=(m?m[0]:'')+await api('convert',{html:clone.innerHTML});visual=false;$('page').contentEditable=false;changed()}view=v;$('raw').hidden=v==='page';$('page').hidden=v==='raw';if(v!=='raw')await preview()}function changed(){dirty=true;status('Unsaved');if(view==='split')preview()}async function save(){if(!path)return false;if(visual)await mode('raw');if(visual)return false;original=await api('save',{path,raw:$('raw').value,expected:original});$('raw').value=original;dirty=false;await refresh();if(view!=='raw')await preview();status('Saved');return true}async function createNote(){if(!data.folders.length)return notice('Open workspace first');let d=dialog_box('Create note'), f=document.createElement('select');for(let x of data.folders)f.add(new Option(x||'Content root',x));f.value=selected_folder;let n=document.createElement('input'),t=document.createElement('input');n.value='new-note';t.value='New Note';d.add('Destination folder',f);d.add('Local filename (.md added automatically)',n);d.add('Displayed title',t);d.finish('Create note',async()=>{let name=n.value.trim().replace(/\.md$/i,'');if(!name||/[\\/:*?"<>|]/.test(name)||/[. ]$/.test(name)||/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(name)||!t.value.trim())throw Error('Invalid filename or title');let p=(f.value?f.value+'/':'')+name+'.md';if(!await leave_note())throw Error('Creation cancelled');await api('new',{path:p,title:t.value.trim()});collapsed.delete(f.value);await refresh();await openNote(p)})}function folder(){if(!data.folders.length)return notice('Open workspace first');let d=dialog_box('New folder'),f=document.createElement('select'),n=document.createElement('input');for(let x of data.folders)f.add(new Option(x||'Content root',x));f.value=selected_folder;d.add('Parent folder',f);d.add('Folder name',n);d.finish('Create folder',async()=>{let name=n.value.trim();if(!name||/[\\/:*?"<>|]/.test(name)||name==='.'||name==='..')throw Error('Invalid folder name');let p=(f.value?f.value+'/':'')+name;await api('folder',{path:p});selected_folder=p;collapsed.delete(f.value);await refresh()})}
async function tags(){if(!data.folders.length)return notice('Open workspace first');let d=dialog_box('Create or edit tag'),existing=document.createElement('select'),id=document.createElement('input'),name=document.createElement('input');existing.add(new Option('New tag',''));for(let k of Object.keys(data.tags))existing.add(new Option(k,k));let c=color_fields('#78a9e8');existing.onchange=()=>{id.value=existing.value;id.readOnly=!!existing.value;name.value=data.tags[id.value]?.name||'';c.set(data.tags[id.value]?.color||'#78a9e8')};d.add('Existing tag',existing);d.add('Tag identifier',id);d.add('Display name',name);d.add('Color',c.box);d.finish('Save tag',async()=>{if(!/^[a-z0-9_-]+$/.test(id.value)||!name.value.trim())throw Error('Invalid tag identifier or name');if(!existing.value&&Object.hasOwn(data.tags,id.value))throw Error('Tag already exists');let next={...data.tags,[id.value]:{...data.tags[id.value],name:name.value.trim(),color:c.get()}};await api('tags',{tags:next});await refresh()})}async function editTags(){if(!path)return notice('Select a note');if(visual)return notice('Finish visual editing before assigning tags');let current=await api('read_tags',{raw:$('raw').value}),d=dialog_box('Assign tags'),box=document.createElement('div'),checks=[],q=document.createElement('input'),count=document.createElement('small');q.placeholder='Search tags...';box.style.cssText='max-height:45vh;overflow:auto';let name=k=>data.tags[k]?.name||k;let keys=[...new Set([...Object.keys(data.tags),...current])].sort((a,b)=>name(a).localeCompare(name(b),undefined,{sensitivity:'base'})||a.localeCompare(b));function update(){let term=q.value.trim().toLowerCase();for(let [k,c,row] of checks)row.style.display=(name(k)+' '+k).toLowerCase().includes(term)?'flex':'none';count.textContent=checks.filter(x=>x[1].checked).length+' selected'}for(let k of keys){let row=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=current.includes(k);c.onchange=update;row.style.cssText='display:flex;align-items:center;gap:8px;padding:7px';let dot=document.createElement('span');dot.style.cssText='width:12px;height:12px;border-radius:50%';dot.style.background=data.tags[k]?.color||'#999';row.append(c,dot,document.createTextNode(name(k)));box.append(row);checks.push([k,c,row])}q.oninput=update;update();d.add('Search tags',q);d.add('Selection',count);d.add('Select tags',box);d.finish('Apply tags',async()=>{let chosen=checks.filter(x=>x[1].checked).map(x=>x[0]);let ordered=[...current.filter(k=>chosen.includes(k)),...chosen.filter(k=>!current.includes(k))];let next=await api('assign_tags',{raw:$('raw').value,tags:ordered});if(next!==$('raw').value){$('raw').value=next;changed()}})}
async function insert(s){if(!path)return;if(view==='page')await mode('raw');let r=$('raw');r.setRangeText(s,r.selectionStart,r.selectionEnd,'end');r.focus();changed()}function internal(){if(!path)return notice('Select a note');let d=dialog_box('Internal reference'),q=document.createElement('input'),sel=document.createElement('select'),t=document.createElement('input');function fill(){sel.replaceChildren();for(let n of data.notes.filter(n=>JSON.stringify([n.title,n.path,n.aliases]).toLowerCase().includes(q.value.toLowerCase())))sel.add(new Option(n.title+' ('+n.path+')',n.path));sel.onchange()}sel.onchange=()=>t.value=data.notes.find(n=>n.path===sel.value)?.title||'';q.oninput=fill;fill();d.add('Search notes',q);d.add('Note',sel);d.add('Display text',t);d.finish('Insert reference',async()=>{if(!sel.value)throw Error('Select a note');await insert('[['+sel.value.replace(/\.md$/i,'')+'|'+t.value+']]')})}
function external(){if(!path)return notice('Select a note');let d=dialog_box('External reference'),u=document.createElement('input'),t=document.createElement('input');d.add('URL',u);d.add('Display text',t);d.finish('Insert link',async()=>{if(!/^https?:\/\//i.test(u.value))throw Error('Enter an HTTP or HTTPS URL');await insert('['+(t.value||u.value)+']('+encodeURI(u.value).replace(/\(/g,'%28').replace(/\)/g,'%29')+')')})}
function embed(){if(!path)return notice('Select a note');let d=dialog_box('Video embed'),u=document.createElement('input');d.add('YouTube privacy-enhanced or Vimeo embed URL',u);d.finish('Insert video',async()=>{if(!/^https:\/\/(www\.youtube-nocookie\.com\/embed\/|player\.vimeo\.com\/video\/)[\w-]+$/.test(u.value))throw Error('Invalid embed URL');await insert('\n<iframe src="'+u.value+'" allowfullscreen></iframe>\n')})}
async function media(el){let f=el.files[0];if(!f||!path)return;let b=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.readAsDataURL(f)});let p=await api('media',{path,name:f.name,data:b});let u=encodeURI(p);await insert(f.type.startsWith('video/')?'\n<video controls playsinline preload="metadata"><source src="'+u+'" type="'+f.type+'"></video>\n':'!['+f.name+']('+u+')');el.value='';await refresh()}function dashboard(){notice('Notes: '+data.notes.length+'\nFolders: '+(data.folders.length-1)+'\nWords: '+data.notes.reduce((s,n)=>s+(n.words||0),0)+'\nReferences: '+data.notes.reduce((s,n)=>s+n.links.length,0)+'\nTags: '+Object.keys(data.tags).length)}function validate(){let keys=new Set(data.notes.flatMap(n=>[n.path.replace(/\.md$/,'').toLowerCase(),n.title.toLowerCase()]));let bad=data.notes.flatMap(n=>n.links.filter(l=>!keys.has(l.toLowerCase())).map(l=>n.path+': '+l));notice(bad.join('\n')||'No unresolved wiki links found')}async function history(){if(!path)return;let h=await api('history',{path});let i=await choose_box('Revision history',h);if(h[Number(i)-1]&&await confirm_box('Load revision into editor? Save to restore.')){$('raw').value=await api('revision',{path,name:h[Number(i)-1]});changed();await mode('raw')}}async function archive(){if(path&&await confirm_box('Move note to private archive? Incoming references may break.')){await api('archive',{path});path='';dirty=false;$('raw').value='';$('page').innerHTML='';await refresh()}}async function template(){let dialog=document.createElement('dialog');dialog.className='studio_dialog';let area=document.createElement('textarea');area.value=await api('get_template');area.style.width='min(650px,75vw)';area.style.height='300px';let save_button=document.createElement('button');save_button.textContent='Save template';save_button.onclick=async()=>{await api('template',{raw:area.value});dialog.close()};let cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=()=>dialog.close();dialog.append(area,save_button,cancel);document.body.append(dialog);dialog.onclose=()=>dialog.remove();dialog.showModal()}async function rename_folder(){if(!selected_folder)return notice('Select a folder first');if(dirty)return notice('Save your changes before renaming');let old=selected_folder,name=await input_box('Rename folder','New folder name',old.split('/').pop());if(!name||!await confirm_box('Rename folder and update affected references?'))return;let target=await api('rename_folder',{path:old,name});selected_folder=target;let next=path.startsWith(old+'/')?target+path.slice(old.length):path;await refresh();if(next)await openNote(next);selected_folder=target;tree()}async function recover(){if(!path)return;let raw=await api('recover',{path});if(raw&&await confirm_box('Load recovered draft?')){$('raw').value=raw;changed();await mode('raw')}}async function visualEdit(){if(!path)return;if(!await confirm_box('Visual conversion can alter custom Markdown and media. Use only for simple text notes.'))return;if(/<|!\[|\[\[|```|\|/.test($('raw').value.replace(/\n---\n\n\*Created:.*$/s,'')))return notice('Complex note: use Markdown mode to preserve content.');await mode('page');visual=true;$('page').contentEditable=true;$('page').focus();dirty=true}setInterval(()=>{if(dirty&&path&&!visual)api('draft',{path,raw:$('raw').value}).catch(()=>{})},10000);window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};api('recent').then(x=>{$('root').value=x.root||''});

function dialog_box(title){let d=document.createElement('dialog');d.style.cssText='background:#1c222c;color:#dce3ed;border:1px solid #536071;border-radius:8px;width:min(440px,90vw)';let h=document.createElement('h2');h.textContent=title;d.append(h);document.body.append(d);d.onclose=()=>d.remove();return {add(label,el){let l=document.createElement('label');l.style.cssText='display:grid;gap:6px;margin:12px 0';l.append(document.createTextNode(label),el);d.append(l)},finish(label,fn){let b=document.createElement('button'),cancel=document.createElement('button');b.textContent=label;cancel.textContent='Cancel';cancel.onclick=()=>d.close();b.onclick=async()=>{b.disabled=true;try{await fn();d.close()}catch(e){err.textContent=e.message;b.disabled=false}};let err=document.createElement('p');err.style.color='#f0a0a0';d.append(err,b,cancel);d.showModal()}}}
function color_fields(value){let box=document.createElement('div'),picker=document.createElement('input'),hex=document.createElement('input');picker.type='color';picker.style.width='65px';picker.style.height='40px';hex.maxLength=7;box.append(picker,hex);function set(v){picker.value=v;hex.value=v}set(value);picker.oninput=()=>hex.value=picker.value;hex.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(hex.value))picker.value=hex.value};return {box,set,get(){if(!/^#[0-9a-f]{6}$/i.test(hex.value))throw Error('Invalid HEX color');return hex.value}}}
async function text_color(){if(!path||visual)return notice('Select text in Markdown or Split view first');if(view==='page')await mode('raw');let r=$('raw'),start=r.selectionStart,end=r.selectionEnd,selected=r.value.slice(start,end),d=dialog_box('Text color'),c=color_fields('#78a9e8'),t=document.createElement('input');t.value=selected;d.add('Text',t);d.add('Color',c.box);d.finish('Apply color',async()=>{if(!t.value)return;let safe=esc(t.value);r.setRangeText('<span style="color:'+c.get()+'">'+safe+'</span>',start,end,'end');changed();r.focus()})}
function attachment(p){let d=dialog_box(p),url='/media/'+token+'/'+p.split('/').map(encodeURIComponent).join('/'),el;if(/\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i.test(p)){el=document.createElement('img');el.src=url}else if(/\.(mp4|webm|ogg|mov)$/i.test(p)){el=document.createElement('video');el.controls=true;el.preload='metadata';el.src=url}else if(/\.(mp3|wav|m4a|flac)$/i.test(p)){el=document.createElement('audio');el.controls=true;el.src=url}else{el=document.createElement('a');el.href=url;el.download=p.split('/').pop();el.textContent='Download file'}el.style.maxWidth='100%';d.add('Attachment preview',el);d.finish('Close',async()=>{})}
async function delete_note(){if(!path)return notice('Select a note');if(dirty)return notice('Save or discard changes first');let n=data.notes.find(n=>n.path===path),keys=[path,path.replace(/\.md$/i,''),path.split('/').pop().replace(/\.md$/i,''),n?.title||''].map(x=>x.toLowerCase());let refs=data.notes.filter(x=>x.path!==path&&x.links.some(l=>keys.includes(l.toLowerCase())));if(!await confirm_box('Delete '+path+'? A local backup will be kept. Attachments remain.\nIncoming references: '+(refs.map(x=>x.path).join(', ')||'None detected')))return;let backup=await api('delete',{path,expected:original});path='';original='';dirty=false;$('raw').value='';$('page').replaceChildren();$('info').replaceChildren();$('title').textContent='Select a note';await refresh();status('Deleted; backup: '+backup)}

function ask_box(title,message,control,choices){return new Promise(resolve=>{let d=document.createElement('dialog'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=message;p.style.whiteSpace='pre-wrap';d.append(h,p);if(control)d.append(control);let result=null;for(let [label,value] of choices){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{result=typeof value==='function'?value():value;d.close()};d.append(b)}d.onclose=()=>{d.remove();resolve(result)};document.body.append(d);d.showModal()})}
function notice(message){return ask_box('Creator Studio',message,null,[['OK',true]])}
async function leave_note(){if(!dirty)return true;let choice=await ask_box('Unsaved changes','Save changes before leaving this note?',null,[['Save changes','save'],['Discard changes','discard'],['Cancel',null]]);if(choice==='save')return await save();if(choice==='discard'){dirty=false;visual=false;$('page').contentEditable=false;$('raw').value=original;status('Saved');if(view!=='raw')await preview();return true}return false}
function confirm_box(message){return ask_box('Confirm action',message,null,[['Confirm',true],['Cancel',false]])}
function input_box(title,label,value){let i=document.createElement('input');i.value=value;return ask_box(title,label,i,[['Continue',()=>i.value],['Cancel',null]])}
function choose_box(title,items){let sel=document.createElement('select');items.forEach((x,i)=>sel.add(new Option(x,i+1)));return ask_box(title,'Select a revision',sel,[['Load',()=>sel.value],['Cancel',null]])}
function existing_media(){if(!path)return notice('Select a note');let d=dialog_box('Reference existing media'),q=document.createElement('input'),sel=document.createElement('select'),t=document.createElement('input');function fill(){sel.replaceChildren();for(let a of (data.attachments||[]).filter(a=>a.toLowerCase().includes(q.value.toLowerCase())))sel.add(new Option(a,a));sel.onchange()}sel.onchange=()=>t.value=sel.value.split('/').pop();q.oninput=fill;fill();d.add('Search attachments',q);d.add('Existing file',sel);d.add('Display text',t);d.finish('Insert media',async()=>{if(!sel.value)throw Error('Select an attachment');let ref=await api('media_reference',{path,attachment:sel.value});let u=ref.url,label=t.value.replace(/[\[\]\r\n]/g,' ');await insert(ref.kind==='video'?'\n<video controls playsinline preload="metadata"><source src="'+u+'"></video>\n':ref.kind==='image'?'!['+label+']('+u+')':'['+label+']('+u+')')})}
</script></html>
